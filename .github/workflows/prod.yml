on:
  push:
    branches: [develop, devops/test-gh-actions]

name: Deploy Petinder-Back

env:
  IMAGE: ${{ secrets.DOCKER_USERNAME }}/petinder:back

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK - Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '21'

      - name: Build do Project
        run: mvn -B clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE }}

deploy:
  needs: build
  runs-on: self-hosted
  env:
    IMAGE: ${{ secrets.DOCKER_USERNAME }}/petinder:back   # garante que IMAGE existe no job de deploy
  steps:
    - name: Liberar porta 8080 e 3306 no firewall (ufw) — só se aplicável
      run: sudo ufw allow 8080/tcp && sudo ufw allow 3306/tcp

    - name: Login no Docker Hub no host de deploy
      run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Pull image do Docker Hub
      run: sudo docker pull "${{ env.IMAGE }}"

    - name: Stop e remove container existente (caso haja)
      run: |
        sudo docker rm -f deploy-back || true

    - name: Run docker container (passando secrets do GitHub Actions)
      run: |
        sudo docker run -d --name deploy-back \
          --restart unless-stopped \
          -p 8080:8080 \
          -e SPRING_PROFILES_ACTIVE=prod \
          -e AWS_ACCESS_KEY_ID="${{ secrets.SEU_ACCESS_ID }}" \
          -e AWS_SECRET_ACCESS_KEY="${{ secrets.SEU_ACCESS_KEY }}" \
          -e AWS_SESSION_TOKEN="${{ secrets.SEU_SESSION_TOKEN }}" \
          -e SENHA_PETINDER_EMAIL="${{ secrets.SENHA_PETINDER_EMAIL }}" \
          "${{ env.IMAGE }}"

    - name: Show last container logs (sanity)
      run: sudo docker logs --tail 200 deploy-back || true