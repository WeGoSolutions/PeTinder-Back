on:
  push:
    branches: [develop, devops/test-gh-actions]

name: Deploy Petinder-Back

env:
  IMAGE: ${{ secrets.DOCKER_USERNAME }}/petinder:back

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK - Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '21'

      - name: Build do Project
        run: mvn -B clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE }}

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Liberar porta 8080 e 3306 no firewall (ufw) — só se aplicável
        run: sudo ufw allow 8080/tcp && sudo ufw allow 3306/tcp

      - name: Checkout repository (required to access compose file)
        uses: actions/checkout@v3

      - name: Ensure docker compose and start RabbitMQ (if not running)
        run: |
          sudo docker rm -f rabbitmq-petinder || true
          echo "Starting rabbitmq via docker compose"
          
          if sudo docker compose version >/dev/null 2>&1; then
            sudo docker compose -f compose.yaml pull || true
            sudo docker compose -f compose.yaml up -d
          elif command -v docker-compose >/dev/null 2>&1; then
            sudo docker-compose -f compose.yaml pull || true
            sudo docker-compose -f compose.yaml up -d
          else
            echo "docker compose not found on runner; please install docker compose" >&2
            exit 1
          fi

      - name: Wait for RabbitMQ healthcheck to be healthy
        run: |
          CONTAINER_NAME=rabbitmq-petinder
          MAX_SECONDS=120
          SLEEP_INTERVAL=5
          echo "Waiting up to ${MAX_SECONDS}s for ${CONTAINER_NAME} to report healthy..."
          elapsed=0
          while [ $elapsed -lt $MAX_SECONDS ]; do
            status=$(sudo docker inspect --format '{{.State.Health.Status}}' ${CONTAINER_NAME} 2>/dev/null || echo "none")
            echo "Current health status: ${status}"
            if [ "${status}" = "healthy" ]; then
              echo "${CONTAINER_NAME} is healthy"
              exit 0
            fi
            sleep ${SLEEP_INTERVAL}
            elapsed=$((elapsed + SLEEP_INTERVAL))
          done
          echo "${CONTAINER_NAME} did not become healthy within ${MAX_SECONDS}s"
          echo "==== Last 200 lines of container logs ===="
          sudo docker logs --tail 200 ${CONTAINER_NAME} || true
          exit 1

      - name: Verify RabbitMQ was created (container/image/status)
        run: |
          echo "== RabbitMQ container list =="
          sudo docker ps -a --filter "name=rabbitmq-petinder" --format "{{.Names}} {{.Image}} {{.Status}}"

          echo "\n== RabbitMQ images (filter) =="
          sudo docker images --filter=reference='rabbitmq*' --format "{{.Repository}}:{{.Tag}} {{.ID}} {{.Size}}" || true

          echo "\n== Docker Compose services (from compose.yaml) =="
          if sudo docker compose version >/dev/null 2>&1; then
            sudo docker compose -f compose.yaml ps || true
          elif command -v docker-compose >/dev/null 2>&1; then
            sudo docker-compose -f compose.yaml ps || true
          fi

          echo "\n== Last RabbitMQ logs (tail 200) =="
          sudo docker logs --tail 200 rabbitmq-petinder || true

      - name: Login no Docker Hub no host de deploy
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Pull image do Docker Hub
        run: sudo docker pull "${{ env.IMAGE }}"

      - name: Stop e remove container existente (caso haja)
        run: |
          sudo docker rm -f deploy-back || true

      - name: Criar env file seguro e rodar container usando --env-file
        run: |
          # write env file into the runner temp directory (writable on self-hosted runners)
          ENV_FILE="$RUNNER_TEMP/petinder.env"
          mkdir -p "$RUNNER_TEMP"

          cat <<EOF > "$ENV_FILE"
          SPRING_PROFILES_ACTIVE=prod
          AWS_ACCESS_KEY_ID=${{ secrets.SEU_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.SEU_SECRET_KEY }}
          AWS_SESSION_TOKEN=${{ secrets.SEU_SESSION_TOKEN }}
          # RabbitMQ connection from inside the app container: map host gateway to host.docker.internal
          SPRING_RABBITMQ_HOST=host.docker.internal
          SPRING_RABBITMQ_PORT=5672
          SPRING_RABBITMQ_USERNAME=admin
          SPRING_RABBITMQ_PASSWORD=admin
          SENHA_PETINDER_EMAIL=${{ secrets.SENHA_PETINDER_EMAIL }}
          EOF

          # ensure no CRLF and set strict permissions (use sudo for chmod/sed in case runner uses restricted dirs)
          sudo sed -i 's/\r$//' "$ENV_FILE" || true
          sudo chmod 600 "$ENV_FILE"

          # run container using the env file
          # detect rabbitmq container network and set network arg + rabbit host accordingly
          NETWORK_NAME=$(sudo docker inspect --format '{{range $k,$v := .NetworkSettings.Networks}}{{printf "%s\n" $k}}{{end}}' rabbitmq-petinder | head -n1 || true)
          if [ -n "$NETWORK_NAME" ]; then
            echo "Will attach app container to network: $NETWORK_NAME"
            NETWORK_ARG="--network $NETWORK_NAME"
            RABBIT_HOST="rabbitmq-petinder"
          else
            echo "No docker network found for rabbitmq-petinder; falling back to host gateway"
            NETWORK_ARG=""
            RABBIT_HOST="host.docker.internal"
          fi

          echo "Using RABBIT_HOST=$RABBIT_HOST"

          sudo docker run -d --name deploy-back \
            $NETWORK_ARG \
            --add-host=host.docker.internal:host-gateway \
            -e SPRING_RABBITMQ_HOST=$RABBIT_HOST \
            --restart unless-stopped \
            --env-file "$ENV_FILE" \
            -p 8080:8080 \
            "${{ env.IMAGE }}"

          # securely remove the env file from the runner
          if command -v shred >/dev/null 2>&1; then
            sudo shred -u "$ENV_FILE" || sudo rm -f "$ENV_FILE"
          else
            sudo rm -f "$ENV_FILE"
          fi

      - name: Show last container logs (sanity)
        run: sudo docker logs --tail 200 deploy-back || true