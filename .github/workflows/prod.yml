on:
  push:
    branches: [develop, devops/test-gh-actions]

name: Deploy Petinder-Back

env:
  IMAGE: ${{ secrets.DOCKER_USERNAME }}/petinder:back

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK - Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '21'

      - name: Build do Project
        run: mvn -B clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE }}

  deploy-pt-01:
    needs: build
    runs-on: [self-hosted, "pt-01"]
    steps:
      - name: Info do runner
        run: |
          echo "Runner target: pt-01"
          hostname
          whoami

      - name: Liberar porta 8080 e 3306 no firewall (ufw) - só se aplicável
        run: sudo ufw allow 8080/tcp && sudo ufw allow 3306/tcp || true

      - name: Checkout repository (required to access compose file)
        uses: actions/checkout@v3

      - name: Login no Docker Hub no host de deploy
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Pull image do Docker Hub
        run: sudo docker pull "${{ env.IMAGE }}"

      - name: Stop e remove container existente (caso haja)
        run: |
          TARGET_NAME="deploy-back"
          TARGET_IMAGE="${{ env.IMAGE }}"
          sudo docker ps -a --filter "name=$TARGET_NAME" --format '{{.ID}}' | xargs -r sudo docker rm -f || true
          sudo docker ps -a --filter "ancestor=$TARGET_IMAGE" --format '{{.ID}}' | xargs -r sudo docker rm -f || true
          sudo docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' | awk -v img="$TARGET_IMAGE" '$0 ~ img {print $2}' | xargs -r sudo docker rmi -f || true

      - name: Criar env file seguro, validar RabbitMQ e rodar container usando --env-file
        run: |
          set -euo pipefail
          ENV_FILE="$RUNNER_TEMP/petinder.env"
          mkdir -p "$RUNNER_TEMP"
          cat > "$ENV_FILE" <<'EOF'
          SPRING_PROFILES_ACTIVE=prod
          AWS_ACCESS_KEY_ID=${{ secrets.SEU_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.SEU_SECRET_KEY }}
          AWS_SESSION_TOKEN=${{ secrets.SEU_SESSION_TOKEN }}
          SENHA_PETINDER_EMAIL=${{ secrets.SENHA_PETINDER_EMAIL }}
          EOF
          sudo sed -i 's/\r$//' "$ENV_FILE" || true
          sudo chmod 600 "$ENV_FILE"

          # Small Linux-friendly RabbitMQ TCP check (tries nc first, then /dev/tcp)
          RABBIT_PROPERTIES_FILE="$(pwd)/src/main/resources/application.properties"
          RABBIT_HOST=""
          RABBIT_PORT=""
          if [ -f "$RABBIT_PROPERTIES_FILE" ]; then
            RABBIT_HOST=$(grep -E '^spring.rabbitmq.host=' "$RABBIT_PROPERTIES_FILE" | sed 's/^spring.rabbitmq.host=//' | tr -d '\r' || true)
            RABBIT_PORT=$(grep -E '^spring.rabbitmq.port=' "$RABBIT_PROPERTIES_FILE" | sed 's/^spring.rabbitmq.port=//' | tr -d '\r' || true)
          fi
          RABBIT_HOST=${RABBIT_HOST:-localhost}
          RABBIT_PORT=${RABBIT_PORT:-5672}
          echo "RabbitMQ endpoint read from properties: $RABBIT_HOST:$RABBIT_PORT"

          retries=5
          for i in $(seq 1 $retries); do
            echo "Checking RabbitMQ connectivity (attempt $i/$retries) to $RABBIT_HOST:$RABBIT_PORT..."
            if command -v nc >/dev/null 2>&1; then
              if nc -z -w3 "$RABBIT_HOST" "$RABBIT_PORT" >/dev/null 2>&1; then
                echo "OK: nc connected to $RABBIT_HOST:$RABBIT_PORT"
                reachable=1
                break
              fi
            else
              # fallback to /dev/tcp (bash builtin)
              if bash -c "cat < /dev/tcp/$RABBIT_HOST/$RABBIT_PORT" >/dev/null 2>&1; then
                echo "OK: /dev/tcp connected to $RABBIT_HOST:$RABBIT_PORT"
                reachable=1
                break
              fi
            fi
            sleep 2
          done

          if [ -z "${reachable+x}" ]; then
            echo "ERROR: RabbitMQ not reachable at $RABBIT_HOST:$RABBIT_PORT after $retries attempts. Aborting deploy."
            exit 1
          fi

          # Run the application container (RabbitMQ settings read from application.properties)
          sudo docker run -d --name deploy-back \
            --add-host=host.docker.internal:host-gateway \
            --restart unless-stopped \
            --env-file "$ENV_FILE" \
            -p 8080:8080 \
            "${{ env.IMAGE }}"

          if command -v shred >/dev/null 2>&1; then
            sudo shred -u "$ENV_FILE" || sudo rm -f "$ENV_FILE"
          else
            sudo rm -f "$ENV_FILE"
          fi

      - name: Show last container logs (sanity)
        run: sudo docker logs --tail 200 deploy-back || true

