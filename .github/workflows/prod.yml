name: Deploy Petinder-Back

on:
    push:
        branches: [develop, devops/test-gh-actions]

jobs:
    build:
        runs-on: ubuntu-latest

        env:
            SENHA_PETINDER_EMAIL: ${{secrets.SENHA_PETINDER_EMAIL}}
            IMAGE: ${{ secrets.DOCKER_USERNAME }}/petinder:back
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up JDK - Java
              uses: actions/setup-java@v3
              with:
                  distribution: temurin
                  java-version: '21'

            - name: Build do Project
              run: mvn -B clean package -DskipTests

            - name: Log in to Docker Hub
              uses: docker/login-action@v2
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v4
              with:
                context: .
                file: ./Dockerfile
                push: true
                tags: ${{ env.IMAGE }}

    deploy: 
        needs: build
        runs-on: self-hosted
        steps:
            - name: Pull image do Docker Hub
              run: sudo docker pull ${{ secrets.DOCKER_USERNAME }}/petinder:back

            - name: Stop and remove existing container (if any)
              run: |
                if [ "$(docker ps -aq -f name=deploy-back)" ]; then
                  docker stop deploy-back || true
                  docker rm deploy-back || true
                fi

            - name: Run docker container
              run: sudo docker run -d -p 8080:8080 --name deploy-back ${{ secrets.DOCKER_USERNAME }}/petinder:back