name: Deploy Petinder-Back

on:
    push:
        branches: [develop, devops/test-gh-actions]

jobs:
    build:
        runs-on: ubuntu-latest

        env:
            SENHA_PETINDER_EMAIL: ${{secrets.SENHA_PETINDER_EMAIL}}
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up JDK - Java
              uses: actions/setup-java@v3
              with:
                  distribution: temurin
                  java-version: '17'

            - name: Build do Project
              run: mvn clean install -DskipTests

            - name: Login no DockerHub
              run: docker login -u ${{secrets.DOCKER_USERNAME}} -p ${{secrets.DOCKER_PASSWORD}}

            - name: Build docker image
              run: docker build -t ${{secrets.DOCKER_USERNAME}}/petinder:back .

            - name: Push image docker
              run:  docker push ${{secrets.DOCKER_USERNAME}}/petinder:back
