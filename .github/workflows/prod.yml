on:
  push:
    branches: [develop, devops/test-gh-actions]

name: Deploy Petinder-Back

env:
  IMAGE: ${{ secrets.DOCKER_USERNAME }}/petinder:back

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK - Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '21'

      - name: Build do Project
        run: mvn -B clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE }}

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Liberar porta 8080 e 3306 no firewall (ufw) — só se aplicável
        run: sudo ufw allow 8080/tcp && sudo ufw allow 3306/tcp

      - name: Checkout repository (required to access compose file)
        uses: actions/checkout@v3

      - name: Ensure docker compose and start RabbitMQ (if not running)
        run: |
          # If a container named `rabbitmq-petinder` is not running, try to start it using the repo's compose.yaml
          if [ -z "$(sudo docker ps -q -f name=rabbitmq-petinder)" ]; then
            echo "rabbitmq not running — attempting to start via docker compose"
            # prefer the docker compose plugin if available
            if sudo docker compose version >/dev/null 2>&1; then
              # pull images first to ensure the host downloads the rabbitmq image
              sudo docker compose -f compose.yaml pull || true
              sudo docker compose -f compose.yaml up -d
            elif command -v docker-compose >/dev/null 2>&1; then
              sudo docker-compose -f compose.yaml pull || true
              sudo docker-compose -f compose.yaml up -d
            else
              echo "docker compose not found on runner; please install docker compose" >&2
              exit 1
            fi
          else
            echo "rabbitmq container already running"
          fi

      - name: Verify RabbitMQ was created (container/image/status)
        run: |
          echo "== RabbitMQ container list =="
          sudo docker ps -a --filter "name=rabbitmq-petinder" --format "{{.Names}} {{.Image}} {{.Status}}"

          echo "\n== RabbitMQ images (filter) =="
          sudo docker images --filter=reference='rabbitmq*' --format "{{.Repository}}:{{.Tag}} {{.ID}} {{.Size}}" || true

          echo "\n== Docker Compose services (from compose.yaml) =="
          if sudo docker compose version >/dev/null 2>&1; then
            sudo docker compose -f compose.yaml ps || true
          elif command -v docker-compose >/dev/null 2>&1; then
            sudo docker-compose -f compose.yaml ps || true
          fi

          echo "\n== Last RabbitMQ logs (tail 200) =="
          sudo docker logs --tail 200 rabbitmq-petinder || true

      - name: Login no Docker Hub no host de deploy
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Pull image do Docker Hub
        run: sudo docker pull "${{ env.IMAGE }}"

      - name: Stop e remove container existente (caso haja)
        run: |
          sudo docker rm -f deploy-back || true

      - name: Criar env file seguro e rodar container usando --env-file
        run: |
          # write env file into the runner temp directory (writable on self-hosted runners)
          ENV_FILE="$RUNNER_TEMP/petinder.env"
          mkdir -p "$RUNNER_TEMP"

          cat <<EOF > "$ENV_FILE"
          SPRING_PROFILES_ACTIVE=prod
          AWS_ACCESS_KEY_ID=${{ secrets.SEU_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.SEU_SECRET_KEY }}
          AWS_SESSION_TOKEN=${{ secrets.SEU_SESSION_TOKEN }}
          SENHA_PETINDER_EMAIL=${{ secrets.SENHA_PETINDER_EMAIL }}
          EOF

          # ensure no CRLF and set strict permissions (use sudo for chmod/sed in case runner uses restricted dirs)
          sudo sed -i 's/\r$//' "$ENV_FILE" || true
          sudo chmod 600 "$ENV_FILE"

          # run container using the env file
          sudo docker run -d --name deploy-back \
            --restart unless-stopped \
            --env-file "$ENV_FILE" \
            -p 8080:8080 \
            "${{ env.IMAGE }}"

          # securely remove the env file from the runner
          if command -v shred >/dev/null 2>&1; then
            sudo shred -u "$ENV_FILE" || sudo rm -f "$ENV_FILE"
          else
            sudo rm -f "$ENV_FILE"
          fi

      - name: Show last container logs (sanity)
        run: sudo docker logs --tail 200 deploy-back || true