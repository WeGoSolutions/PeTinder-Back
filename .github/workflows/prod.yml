on:
  push:
    branches: [develop, devops/test-gh-actions]

name: Deploy Petinder-Back

env:
  IMAGE: ${{ secrets.DOCKER_USERNAME }}/petinder:back

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK - Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '21'

      - name: Build do Project
        run: mvn -B clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE }}

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Liberar porta 8080 e 3306 no firewall (ufw) — só se aplicável
        run: sudo ufw allow 8080/tcp && sudo ufw allow 3306/tcp

      - name: Login no Docker Hub no host de deploy
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Pull image do Docker Hub
        run: sudo docker pull "${{ env.IMAGE }}"

      - name: Stop e remove container existente (caso haja)
        run: |
          sudo docker rm -f deploy-back || true

      - name: Criar env file seguro e rodar container usando --env-file
        run: |
          # start a fresh env file (no leading spaces)
          echo "SPRING_PROFILES_ACTIVE=prod" | sudo tee /tmp/petinder.env > /dev/null

          # append AWS secrets and email secret (preserve the secret names you specified)
          echo "AWS_ACCESS_KEY_ID=${{ secrets.SEU_ACCESS_ID }}" | sudo tee -a /tmp/petinder.env > /dev/null
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.SEU_SECRET_KEY }}" | sudo tee -a /tmp/petinder.env > /dev/null
          echo "AWS_SESSION_TOKEN=${{ secrets.SEU_SESSION_TOKEN }}" | sudo tee -a /tmp/petinder.env > /dev/null
          echo "SENHA_PETINDER_EMAIL=${{ secrets.SENHA_PETINDER_EMAIL }}" | sudo tee -a /tmp/petinder.env > /dev/null

          # ensure no CRLF and set strict permissions
          sudo sed -i 's/\r$//' /tmp/petinder.env
          sudo chmod 600 /tmp/petinder.env

          # run container using the env file
          sudo docker run -d --name deploy-back \
            --restart unless-stopped \
            --env-file /tmp/petinder.env \
            -p 8080:8080 \
            "${{ env.IMAGE }}"

      - name: Show last container logs (sanity)
        run: sudo docker logs --tail 200 deploy-back || true